[package]
name = "graphite-gtk"
version = "0.0.1"
description = "GTK 4 / GSK backend for graphite"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
graphite = { path = "../graphite" }
gtk = { package = "gtk4", version = "0.11", features = ["v4_22"] }
gsk = { package = "gsk4", version = "0.11", features = ["v4_22", "vulkan"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
graphite-conformance = { path = "../graphite-conformance" }

# GTK objects are bound to the main thread: these targets provide `main`.
[[test]]
name = "conformance"
harness = false

[[test]]
name = "widget"
harness = false
